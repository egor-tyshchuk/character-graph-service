name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen mypy app tests

      - name: Tests
        run: uv run --frozen pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compose config (Compose v2)
        run: docker compose config -q

      - name: Compose config (legacy docker-compose)
        run: |
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose config -q
          else
            echo "legacy docker-compose is not installed; skipping"
          fi

      - name: Build image
        run: docker build .
