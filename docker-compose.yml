version: "3.8"

x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me-please}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-86400}
  REFRESH_FAMILY_MAX_LIFETIME_SECONDS: ${REFRESH_FAMILY_MAX_LIFETIME_SECONDS:-604800}
  APP_TOKENS: ${APP_TOKENS:-demo:05c7cd5c50922870dcfe86ad612a8a32ff0ae65eb6d7894a0b852403fbf25767}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
  REDIS_URL: redis://redis:6379/0
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
  VISION_MODEL: ${VISION_MODEL:-gpt-4.1-mini}
  JUDGE_MODEL: ${JUDGE_MODEL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
  JOB_QUEUE: arq
  UPLOAD_DIR: /data/uploads
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
  CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-6000}
  CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-500}
  MAX_CHUNKS_PER_ARTICLE: ${MAX_CHUNKS_PER_ARTICLE:-200}
  PDF_MAX_IMAGES: ${PDF_MAX_IMAGES:-20}
  PDF_MIN_IMAGE_SIDE: ${PDF_MIN_IMAGE_SIDE:-100}
  PDF_SCANNED_PAGE_MIN_CHARS: ${PDF_SCANNED_PAGE_MIN_CHARS:-50}
  PDF_RENDER_DPI: ${PDF_RENDER_DPI:-150}
  VISION_MODE: ${VISION_MODE:-auto}
  PDF_DRAWINGS_MIN_COUNT: ${PDF_DRAWINGS_MIN_COUNT:-20}
  PDF_DRAWINGS_MIN_AREA_RATIO: ${PDF_DRAWINGS_MIN_AREA_RATIO:-0.12}
  DEDUP_CANDIDATES: ${DEDUP_CANDIDATES:-5}
  DEDUP_AUTO_MERGE_THRESHOLD: ${DEDUP_AUTO_MERGE_THRESHOLD:-0.95}
  DEDUP_JUDGE_THRESHOLD: ${DEDUP_JUDGE_THRESHOLD:-0.65}
  DEDUP_MAX_JUDGE_CALLS_PER_ARTICLE: ${DEDUP_MAX_JUDGE_CALLS_PER_ARTICLE:-10}
  RELATION_TYPE_QUERY_THRESHOLD: ${RELATION_TYPE_QUERY_THRESHOLD:-0.7}
  RESOLVE_LOCK_TIMEOUT_SECONDS: ${RESOLVE_LOCK_TIMEOUT_SECONDS:-900}
  RESOLVE_LOCK_ACQUIRE_TIMEOUT_SECONDS: ${RESOLVE_LOCK_ACQUIRE_TIMEOUT_SECONDS:-600}
  MERGE_LOCK_ACQUIRE_TIMEOUT_SECONDS: ${MERGE_LOCK_ACQUIRE_TIMEOUT_SECONDS:-10}
  RECONCILE_ENABLED: ${RECONCILE_ENABLED:-false}
  RECONCILE_INTERVAL_MINUTES: ${RECONCILE_INTERVAL_MINUTES:-60}
  RECONCILE_BATCH_SIZE: ${RECONCILE_BATCH_SIZE:-200}
  RECONCILE_MAX_JUDGE_CALLS: ${RECONCILE_MAX_JUDGE_CALLS:-50}
  STUCK_SWEEP_ENABLED: ${STUCK_SWEEP_ENABLED:-true}
  STUCK_SWEEP_INTERVAL_MINUTES: ${STUCK_SWEEP_INTERVAL_MINUTES:-10}
  STUCK_ARTICLE_AFTER_SECONDS: ${STUCK_ARTICLE_AFTER_SECONDS:-4200}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-3600}
  JOB_MAX_TRIES: ${JOB_MAX_TRIES:-3}
  JOB_RETRY_DELAY_SECONDS: ${JOB_RETRY_DELAY_SECONDS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}

x-app: &app
  build: .
  image: character-graph-service:latest
  environment: *app-env
  volumes:
    - uploads:/data/uploads
  depends_on:
    neo4j:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-256m}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  neo4j_data:
  uploads:
